<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0c12"/><stop offset="100%" stop-color="#141020"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3b52"/><stop offset="35%" stop-color="#ffb648"/><stop offset="70%" stop-color="#3fa9d6"/><stop offset="100%" stop-color="#22d3a6"/>
    </linearGradient>
    <linearGradient id="shineG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity="0.35"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="haoriMini" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#22d3a6" opacity="0.10"/>
      <rect x="7" y="7" width="7" height="7" fill="#22d3a6" opacity="0.10"/>
      <rect x="7" y="0" width="7" height="7" fill="#ff3b52" opacity="0.06"/>
      <rect x="0" y="7" width="7" height="7" fill="#ff3b52" opacity="0.06"/>
    </pattern>
<clipPath id="trophiesClip"><rect width="900" height="200" rx="18"/></clipPath></defs>
  <style>
    .card-bg-in { animation: cardFade 0.6s ease-out both; }
    @keyframes cardFade { from { opacity:0; } to { opacity:1; } }
    .slide-in { opacity:0; animation: slideIn 0.6s cubic-bezier(.2,.8,.3,1) forwards; }
    @keyframes slideIn { from { opacity:0; transform: translateX(-16px);} to { opacity:1; transform: translateX(0);} }
    .bar-grow { animation: barGrow 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes barGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .pop-in { opacity:0; animation: popIn2 0.5s cubic-bezier(.2,1.4,.4,1) forwards; }
    @keyframes popIn2 { 0% { opacity:0; transform: scale(0.5);} 70% { opacity:1;} 100% { opacity:1; transform: scale(1);} }
    .shine-sweep { animation: sweep 4.5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-140%);} 45% { transform: translateX(140%);} 100% { transform: translateX(140%);} }
    .ring-draw { animation: ringDraw 1.6s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes ringDraw { from { stroke-dashoffset: var(--full);} }
    .twinkle2 { animation: tw2 2.4s ease-in-out infinite; }
    @keyframes tw2 { 0%,100% { opacity:0.3;} 50% { opacity:1;} }
    .crest-spin-mini { animation: crestSpinMini 8s linear infinite; transform-origin: center; opacity: 0.85; }
    @keyframes crestSpinMini { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
    .wisteria-mini { animation: wMiniSway 4.5s ease-in-out infinite; transform-origin: center top; opacity: 0.8; }
    @keyframes wMiniSway { 0%,100% { transform: rotate(-7deg);} 50% { transform: rotate(7deg);} }
    @media (prefers-reduced-motion: reduce) {
      .card-bg-in, .slide-in, .bar-grow, .pop-in, .shine-sweep, .ring-draw, .twinkle2, .crest-spin-mini, .wisteria-mini { animation: none !important; opacity:1 !important; }
    }
</style>
