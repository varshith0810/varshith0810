      <rect x="90" y="-10" width="70" height="6" rx="3" fill="rgba(255,255,255,0.045)"/>
      <rect x="90" y="-10" width="9.8" height="6" rx="3" fill="#ffb648" class="bar-grow" style="transform-origin:left center"/>
      <text x="168" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffb648">14%</text>
    </g>
<g class="slide-in" style="animation-delay:0.45s" transform="translate(24,112)">
      <circle cx="4" cy="-4" r="4.5" fill="#6fb2ff"/>
      <text x="16" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#f4f1e8">SQL</text>
      <rect x="90" y="-10" width="70" height="6" rx="3" fill="rgba(255,255,255,0.045)"/>
      <rect x="90" y="-10" width="8.4" height="6" rx="3" fill="#6fb2ff" class="bar-grow" style="transform-origin:left center"/>
      <text x="168" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#6fb2ff">12%</text>
    </g>
<g class="slide-in" style="animation-delay:0.55s" transform="translate(24,136)">
      <circle cx="4" cy="-4" r="4.5" fill="#c98cff"/>
      <text x="16" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#f4f1e8">HTML/CSS</text>
      <rect x="90" y="-10" width="70" height="6" rx="3" fill="rgba(255,255,255,0.045)"/>
      <rect x="90" y="-10" width="5.6" height="6" rx="3" fill="#c98cff" class="bar-grow" style="transform-origin:left center"/>
      <text x="168" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#c98cff">8%</text>
    </g>
<g class="slide-in" style="animation-delay:0.65s" transform="translate(24,160)">
      <circle cx="4" cy="-4" r="4.5" fill="#96a0ad"/>
      <text x="16" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#f4f1e8">Other</text>
      <rect x="90" y="-10" width="70" height="6" rx="3" fill="rgba(255,255,255,0.045)"/>
      <rect x="90" y="-10" width="2.8" height="6" rx="3" fill="#96a0ad" class="bar-grow" style="transform-origin:left center"/>
      <text x="168" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#96a0ad">4%</text>
    </g>
    <rect x="24" y="150" width="432" height="14" rx="7" fill="rgba(255,255,255,0.045)"/>
    <clipPath id="segClip"><rect x="24" y="150" width="432" height="14" rx="7"/></clipPath>
    <g clip-path="url(#segClip)"><rect x="24.0" y="150" width="0" height="14" rx="0" fill="#22d3a6"><animate attributeName="width" from="0" to="181.4" dur="1s" begin="0.20s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/></rect>
<rect x="205.4" y="150" width="0" height="14" rx="0" fill="#ff3b52"><animate attributeName="width" from="0" to="86.4" dur="1s" begin="0.28s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/></rect>
<rect x="291.8" y="150" width="0" height="14" rx="0" fill="#ffb648"><animate attributeName="width" from="0" to="60.5" dur="1s" begin="0.36s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/></rect>
<rect x="352.3" y="150" width="0" height="14" rx="0" fill="#6fb2ff"><animate attributeName="width" from="0" to="51.8" dur="1s" begin="0.44s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/></rect>
<rect x="404.2" y="150" width="0" height="14" rx="0" fill="#c98cff"><animate attributeName="width" from="0" to="34.6" dur="1s" begin="0.52s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/></rect>
<rect x="438.7" y="150" width="0" height="14" rx="0" fill="#96a0ad"><animate attributeName="width" from="0" to="17.3" dur="1s" begin="0.60s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/></rect></g>
    <text x="24" y="190" font-family="Segoe UI,Arial,sans-serif" font-size="10.5" fill="#96a0ad">Based on primary languages across public repositories</text>
  </g>
</svg>