      <rect x="90" y="-10" width="70" height="6" rx="3" fill="rgba(255,255,255,0.045)"/>
      <rect x="90" y="-10" width="14.0" height="6" rx="3" fill="#ff3b52" class="bar-grow" style="transform-origin:left center"/>
      <text x="168" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ff3b52">20%</text>
