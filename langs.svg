<svg width="480" height="220" viewBox="0 0 480 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0c12"/><stop offset="100%" stop-color="#141020"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff3b52"/><stop offset="50%" stop-color="#ffb648"/><stop offset="100%" stop-color="#22d3a6"/>
    </linearGradient>
    <linearGradient id="shineG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity="0.35"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
<clipPath id="langsClip"><rect width="480" height="220" rx="18"/></clipPath></defs>
  <style>
    .card-bg-in { animation: cardFade 0.6s ease-out both; }
    @keyframes cardFade { from { opacity:0; } to { opacity:1; } }
    .slide-in { opacity:0; animation: slideIn 0.6s cubic-bezier(.2,.8,.3,1) forwards; }
    @keyframes slideIn { from { opacity:0; transform: translateX(-16px);} to { opacity:1; transform: translateX(0);} }
    .bar-grow { animation: barGrow 1.2s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes barGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .pop-in { opacity:0; animation: popIn2 0.5s cubic-bezier(.2,1.4,.4,1) forwards; }
    @keyframes popIn2 { 0% { opacity:0; transform: scale(0.5);} 70% { opacity:1;} 100% { opacity:1; transform: scale(1);} }
    .shine-sweep { animation: sweep 4.5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-140%);} 45% { transform: translateX(140%);} 100% { transform: translateX(140%);} }
    .ring-draw { animation: ringDraw 1.6s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes ringDraw { from { stroke-dashoffset: var(--full);} }
    .twinkle2 { animation: tw2 2.4s ease-in-out infinite; }
    @keyframes tw2 { 0%,100% { opacity:0.3;} 50% { opacity:1;} }
    @media (prefers-reduced-motion: reduce) {
      .card-bg-in, .slide-in, .bar-grow, .pop-in, .shine-sweep, .ring-draw, .twinkle2 { animation: none !important; opacity:1 !important; }
    }
</style>
  <g clip-path="url(#langsClip)" class="card-bg-in">
    <rect width="480" height="220" fill="url(#cbg)"/>
    <rect x="0.75" y="0.75" width="478.5" height="218.5" rx="17" fill="none" stroke="rgba(255,255,255,0.10)"/>
    <text x="24" y="24" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="800" fill="#f4f1e8">Most Used Languages</text>
    <g class="slide-in" style="animation-delay:0.15s" transform="translate(24,40)">
      <circle cx="4" cy="-4" r="4.5" fill="#22d3a6"/>
      <text x="16" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="12.5" fill="#f4f1e8">Python</text>
      <rect x="90" y="-10" width="70" height="6" rx="3" fill="rgba(255,255,255,0.045)"/>
      <rect x="90" y="-10" width="29.4" height="6" rx="3" fill="#22d3a6" class="bar-grow" style="transform-origin:left center"/>
      <text x="168" y="0" font-family="Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#22d3a6">42%</text>
    </g>
<g class="slide-in" style="animation-delay:0.25s" transform="translate(24,64)">
