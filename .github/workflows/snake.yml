name: Generate Contribution Snake

on:
  schedule:
    # Runs once a day at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/[email protected]
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23ff3b52,%23ffb648,%2322d3a6&color_dots=%23161b22,%230d1420,%231f6f5c,%2322d3a6,%23ffb648
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23ff3b52,%23ffb648,%2322d3a6
            dist/github-contribution-grid-snake.gif?color_snake=%23ff3b52,%23ffb648,%2322d3a6&color_dots=%23161b22,%230d1420,%231f6f5c,%2322d3a6,%23ffb648

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
